[project]
name = "cite"
version = "0.1.0"
description = "A deterministic citation/reference manager for agent use"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pypdf>=4.2",
    "python-slugify>=8.0",
    "pydantic>=2.7",
]

[project.scripts]
cite = "cite.cli:app"
cite-mcp = "cite.mcp:main"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
# Optional, heavy: local full-markdown extraction (`cite extract`). Pulls torch +
# the granite_docling VLM weights (downloaded/cached locally on first run).
extract = ["docling>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cite"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: real docling pipeline (heavy; needs the 'extract' extra, downloads model on first run)",
]
