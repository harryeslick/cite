[project]
name = "cite"
dynamic = ["version"]
description = "A deterministic citation/reference manager for agent use"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "curl-cffi>=0.7",
    "pypdf>=4.2",
    "python-slugify>=8.0",
    "pydantic>=2.7",
    "selectolax>=0.3.21",
]

[project.scripts]
cite = "cite.cli:app"
cite-mcp = "cite.mcp:main"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
# Optional, heavy: local full-markdown extraction (`cite extract`). Pulls torch +
# the granite_docling VLM weights (downloaded/cached locally on first run).
# On Apple Silicon, mlx-vlm enables docling's MLX engine (granite-docling-258M-mlx);
# without it docling falls back to the much slower Transformers path.
extract = [
    "docling>=2.0",
    # Tabular supplements (.xlsx). Tiny, pure-Python; CSV/TSV need nothing at all.
    "openpyxl>=3.1",
    "mlx-vlm; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Convenience: install every optional feature in one shot.
#   uv sync --extra all   (or: uv sync --all-extras / pip install 'cite[all]')
all = ["cite[mcp,extract]"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cite"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: real docling pipeline (heavy; needs the 'extract' extra, downloads model on first run)",
]
